# CodeRabbit settings for FoundryVTT-dice-trails.
# Shared rules come from the central dxcufgb/coderabbit repository (inheritance: true), and CodeRabbit reads
# the README as code guidelines. Only what is specific to this repository is here.
# Paths here must not repeat a central path (scripts/**/*.js, .github/workflows/**, **/*.sh, **/*.ps1, **/*.iss,
# module.json, **/*.md): an entry with the same path replaces the central one instead of adding to it.
# Check the merged result on a pull request with: @coderabbitai configuration
inheritance: true

reviews:
  path_filters:
    - "!textures/**"
    - "!sounds/**"
  path_instructions:
    - path: "scripts/**"
      instructions: |
        Requires Dice So Nice 5: guard its API and fail soft if it is missing or changes. Trails are drawn every
        frame while dice roll: no allocation or document lookups per frame, and every PIXI object, ticker
        callback and hook is removed when the roll ends. Per-user look settings are `client` scope; world
        settings only for GM choices. Adding a design or damage type: its name and hint strings in lang/en.json
        and a README entry.
    - path: "tools/**"
      instructions: |
        Offline generators for the shipped textures and sounds, not loaded by Foundry. Output must be
        reproducible (seeded) so a regenerated asset only changes when its inputs change.
    - path: ".github/workflows/{ci,release}.yml"
      instructions: |
        Thin callers of dxcufgb/foundry-module-ci, identical in every Foundry module repository. Flag any change
        here that is not the same change in all modules (it belongs in foundry-module-ci instead), except the
        pinned SHA of foundry-module-ci itself.
